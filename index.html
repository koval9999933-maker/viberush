<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeRush — Битва Стримеров</title>
    <!-- Подключаем крутой современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Шапка профиля -->
        <header class="header">
            <div class="logo">⚡ VIBERUSH</div>
            <div class="balance-badge">
                <span class="coin-icon">🐟</span>
                <span id="balance">1000</span> <small>VRSH</small>
            </div>
        </header>

        <!-- Главное поле битвы -->
        <main class="battle-card">
            <div class="battle-title">🔥 БАТЛ СТРИМЕРОВ 🔥</div>
            <div class="score-board">
                <div class="fighter-score">
                    <span id="score1">0</span>
                    <label>Стример 1</label>
                </div>
                <div class="vs-badge">VS</div>
                <div class="fighter-score">
                    <span id="score2">0</span>
                    <label>Стример 2</label>
                </div>
            </div>
        </main>

        <!-- Панель управления (Кнопки доната/поддержки) -->
        <section class="controls">
            <div class="column">
                <h3>Стример 1</h3>
                <button class="btn gift-btn" onclick="support(1, 50, 'fish')">
                    <span>🐟 Рыбка</span>
                    <span class="price">-50</span>
                </button>
                <button class="btn boost-btn" onclick="support(1, 1000, 'rocket')">
                    <span>🚀 Ракета</span>
                    <span class="price">-1000</span>
                </button>
            </div>

            <div class="column">
                <h3>Стример 2</h3>
                <button class="btn gift-btn" onclick="support(2, 50, 'fish')">
                    <span>🐟 Рыбка</span>
                    <span class="price">-50</span>
                </button>
                <button class="btn boost-btn" onclick="support(2, 1000, 'rocket')">
                    <span>🚀 Ракета</span>
                    <span class="price">-1000</span>
                </button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
